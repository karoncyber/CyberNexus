<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Calculator | CyberNexus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

<header>
    <nav>
        <div class="logo">
            <span>CyberNexus</span>
        </div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="network-tools.html">Back</a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>Subnet Calculator</h2>
        <p>Calculate network, broadcast, and host ranges.</p>
    </section>

    <section class="tool-container">

        <div class="tool-card">

            <label for="ip-input">IP Address</label>

            <input
                type="text"
                id="ip-input"
                placeholder="e.g. 192.168.1.10"
            >

            <label for="cidr-input">CIDR Prefix</label>

            <input
                type="number"
                id="cidr-input"
                value="24"
                min="0"
                max="32"
            >

            <button id="calculate-btn">
                Calculate
            </button>

            <p id="subnet-warning"></p>

            <div class="result-list" id="subnet-results"></div>

        </div>

    </section>

</main>

<script src="../js/background.js"></script>

<script src="../js/subnet-calculator.js"></script>

</body>
</html>
