<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSP Analyzer | CyberNexus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

<header>
    <nav>
        <div class="logo">
            <span>CyberNexus</span>
        </div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="web-security.html">Back</a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>CSP Analyzer</h2>
        <p>Break down a Content-Security-Policy header.</p>
    </section>

    <section class="tool-container">

        <div class="tool-card">

            <label for="csp-input">Content-Security-Policy Header</label>

            <textarea
                id="csp-input"
                placeholder="e.g. default-src 'self'; script-src 'self' 'unsafe-inline'"
            ></textarea>

            <button id="analyze-btn">
                Analyze Policy
            </button>

            <div class="result-list" id="csp-results"></div>

            <ul id="warnings"></ul>

        </div>

    </section>

</main>

<script src="../js/background.js"></script>

<script src="../js/csp-analyzer.js"></script>

</body>
</html>
