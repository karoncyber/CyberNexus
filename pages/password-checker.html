<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Checker | CyberNexus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

<header>
    <nav>
        <div class="logo">
            <span>CyberNexus</span>
        </div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="password-tools.html">Back</a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>Password Strength Checker</h2>
        <p>Analyze the strength of your password.</p>
    </section>

    <section class="tool-container">

        <div class="tool-card">

            <label for="password-input">
                Enter Password
            </label>

            <input
                type="password"
                id="password-input"
                placeholder="Type a password"
            >
            <label>
                <input type="checkbox" id="show-password">
                Show Password
            </label>

            <div class="strength-container">
                <div id="strength-bar"></div>
            </div>

            <p id="strength-text">
                Strength: N/A
            </p>

            <ul id="requirements">
                <li id="length-check">✖ At least 8 characters</li>
                <li id="uppercase-check">✖ Uppercase letter</li>
                <li id="number-check">✖ Number</li>
                <li id="symbol-check">✖ Symbol</li>
                <ul id="warnings"></ul>
            </ul>

        </div>

    </section>

</main>

<script src="../js/background.js"></script>

<script src="../js/password-checker.js"></script>

</body>
</html>
