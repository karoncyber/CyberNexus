<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | CyberNexus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

<header>
    <nav>
        <div class="logo">
            <span>CyberNexus</span>
        </div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="password-tools.html">Back</a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>Password Generator</h2>
        <p>Generate secure random passwords.</p>
    </section>

    <section class="tool-container">

        <div class="tool-card">

            <label>Password Length</label>
            <input type="number" id="length" value="16" min="4" max="64">

            <label>
                <input type="checkbox" id="numbers" checked>
                Include Numbers
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Include Symbols
            </label>

            <button id="generate-btn">
                Generate Password
            </button>

            <input
                type="text"
                id="password-output"
                readonly
                placeholder="Your password will appear here"
            >
            <div class="strength-container">
                <div id="strength-bar"></div>
            </div>

            <p id="strength-text">Strength: N/A</p>

            <button id="copy-btn">
                Copy Password
            </button>

        </div>

    </section>

</main>

<script src="../js/background.js"></script>

<script src="../js/password-generator.js"></script>

</body>
</html>
